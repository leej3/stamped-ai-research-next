[workspace]
name = "stamped-ai-research-next"
channels = ["conda-forge"]
platforms = [{ platform = "osx-arm64", macos = "14.0" }, "linux-64"]

[dependencies]
python = ">=3.11,<3.14"
git = "*"
numpy = "*"
scipy = "*"
nibabel = "*"
nilearn = "*"
pandas = "*"
matplotlib-base = "*"
pyyaml = "*"
jsonschema = "*"
pre-commit = "*"
tomlkit = "*"
pytest = "*"
rfc3339-validator = "*"

[tasks]
analysis = "python scripts/analyze.py"
pilot = "python scripts/analyze.py --pilot"
nibabel = ">=5.4.2,<6"
nilearn = ">=0.14.1,<0.15"

[pypi-dependencies]
datalad = "*"
git-annex = "*"
con-duct = "*"
tiktoken = "*"
pytest-evals = "==0.3.4"
tox = "*"

